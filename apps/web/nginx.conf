# Cloudflare sends the client scheme inside CF-Visitor as JSON, e.g.
# {"scheme":"https"}. Map it to a plain scheme nginx can forward upstream.
map $http_cf_visitor $cf_forwarded_proto {
    default          http;
    '~*"scheme"\s*:\s*"https"'  https;
    '~*"scheme"\s*:\s*"http"'   http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Same-origin API proxy so the browser never issues cross-origin requests.
    # Cloudflare terminates TLS, so forward the real client scheme from the
    # CF-Visitor header instead of nginx's internal http.
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
        # Preserve Cloudflare's authoritative client address for rate limiting.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Never cache API responses at the edge.
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass http://api:3000/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
